; Gun firmware for an ESP32-WROOM-32 dev board.
;
;   pio run -t upload        build and flash the gun
;   pio test -e native       run the tracking unit tests on this computer
;
; pioarduino is used because the official PlatformIO espressif32 platform
; does not ship ESP32 Arduino core 3.x.

[platformio]
default_envs = esp32

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
