; Receiver firmware for an ESP32-S3 connected to the Raspberry Pi over USB.
;
; pioarduino is used because the official PlatformIO espressif32 platform
; does not ship ESP32 Arduino core 3.x.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra

; USB-OTG (TinyUSB) mode so the native USB port can act as a HID device.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
