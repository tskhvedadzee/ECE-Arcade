; Receiver firmware for an ESP32-S3 connected to the Raspberry Pi over USB.
;
; pioarduino is used because the official PlatformIO espressif32 platform
; does not ship ESP32 Arduino core 3.x.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra

; The USB library also builds its host and mass-storage sources, which include
; FS.h. deep+ lets the dependency finder see that and add the FS library.
lib_deps = FS

; USB-OTG (TinyUSB) mode so the native USB port can act as a HID device.
; USB-OTG (TinyUSB) mode so the native USB port can act as a HID device.
; The USB library's mass-storage sources include FS.h without declaring a
; dependency on it, so the FS headers are added to the include path.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

upload_port = /dev/cu.usbmodem5C372501491
monitor_port = /dev/cu.usbmodem5C372501491